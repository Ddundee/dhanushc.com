name = "dhanushcdotcom"
main = ".open-next/worker.js"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Required for OpenNext / Next.js on Cloudflare
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "dhanushcdotcom"

# Static assets generated by OpenNext
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Optional, but commonly needed for Next.js apps
[vars]
NODE_ENV = "production"

[observability.logs]
enabled = false
invocation_logs = true
